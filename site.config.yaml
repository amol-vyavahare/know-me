# ─────────────────────────────────────────────────────────────
#  Site-wide settings. Change a line, commit, push — the site rebuilds.
# ─────────────────────────────────────────────────────────────

# The persona shown at  https://<username>.github.io/know-me/
# Must match a file in /roles (qa | devops | product-owner)
active_role: qa

# Personas that get their own URL:  /know-me/r/<id>/
roles_enabled: [qa, devops, product-owner]

# Also build /know-me/r/all/ with every public item, unfiltered
all_view: true

# Show items that have no `roles:` at all in every persona?
show_untagged: false

# Company names on items marked `confidential: true`
#   show → real `company` name is shown
#   mask → `company_alias` is shown, and the real name is replaced in the body text too
#   hide → confidential items are left out of the site completely
confidential_mode: mask

# ── About you ────────────────────────────────────────────────
name: Amol Vyavahare
tagline: Software professional · builder · problem solver
location: Pune, India
avatar: /avatar.svg          # put your photo in /public and point to it
email: you@example.com       # shown on Contact; leave blank to hide
availability: Open to new roles   # small status pill; blank to hide
links:
  - { label: GitHub,   url: https://github.com/your-github-username }
  - { label: LinkedIn, url: https://www.linkedin.com/in/your-profile }

# Career start, used for the "years of experience" stat
career_start: 2014-06-01

# Fallback URL for local builds. On GitHub Actions the real
# https://<owner>.github.io/<repo> is filled in automatically.
site_url: https://your-github-username.github.io
base_path: /know-me
